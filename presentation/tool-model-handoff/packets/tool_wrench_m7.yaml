modelling_and_seating_instructions: The Bahco 111M-7 ring is 5.3 mm thick and its
  open jaw is 17.1 mm wide. Both ends exceed one dimension of the 16 × 4.5 mm single
  pocket. Start with the FACOM 34.7 slim double-ended reference or the actual workshop
  specimen and verify both head widths and thicknesses. Compare the four-spanner holder
  and bench separately.
