modelling_and_seating_instructions: The representative is now the Stahlwille OPEN
  BOX 14, article 40100808. Its 17.5 × 5 mm open head fits the 18 × 5.5 mm single
  pocket with the open end down in the simplified pose. The ring offset is simplified.
  The previous FACOM 34.8 reference has an 18.5 mm head and intersected the pocket
  in a centred insertion check. Measure the actual workshop spanner and check the
  mixed holders separately.
existing_model_note: Generic 8 mm combination spanner using Stahlwille OPEN BOX 14
  article 40100808 as a dimensional reference. Length and both head widths and thicknesses
  follow the catalogue. The straight body, head outlines and ring offset are simplified.
  The workshop specimen has not been measured.
