# Keys match get_tools() in the OOMP populate declarations. Dimensions are mm.
sharpie_style_13mm: Reuse the 13 × 137 generic capped marker. Seat its narrow end in the vertical project's bores. Confirm the cap clears neighbouring copies in both staggered layers.
tool_marker_sharpie: Reuse the existing capped Sharpie model. Check shoulder seating in the v4 single row and the bench stand separately. Keep its branded identity separate from the generic 13 mm model.
tool_marker_bic_clear_lid: Identify the BIC variant from a sample or labelled source. Measure capped length, cap and barrel diameters, and clip projection. Use a clear or translucent cap material. Check clip clearance at the multi-place pitch.
tool_marker_german_big: The name identifies a large marker without a brand or article number. Obtain a side view with a scale, measure widest cap and barrel and check circular versus chisel-shaped body. Seat capped end according to the actual shoulder.
tool_marker_ikea_mala: Use the UK MÅLA product images to identify the barrel, coloured cap and end plug. Measure the individual capped pen or calibrate a straight-on photograph. IKEA's package length covers the whole box. Check all adjacent caps.
tool_marker_patterned_thicker: Obtain a side-on sample photo and cap, body and length measurements. Use the thick silhouette and a simple representative band for recognition. Check the largest diameter against every multi-place centre.
tool_tdpb_glue_stick_prit_medium: The independent model represents PLUS Pritt medium NS-702, approximately 20 g and 26 × 95 mm. The single-place guide is complete. Measure the actual workshop stick and check the compound holder with its separate closed knife.
tool_tdpb_drill_cleaner_m3: Identify the M3 cleaner and measure working end, shank, grip and length. Build the sections on one axis. The v4 Ø3.6 × 100 cutout is clearance only. Store the working end down and check the grip remains accessible.
tool_tdpb_drill_cleaner_m6: Identify the M6 cleaner and measure its working end, shank, grip and length independently of M3. The v4 Ø6.6 × 100 cutout is clearance only. Check tip seating and shoulder height.
tool_tdpb_nozzle_changer: Establish which nozzle-changing tool the TDPB record describes. Measure the socket or nose, shank, grip and length from a specimen or drawing before choosing the sections. The Ø12 × 100 cylinder describes its pocket.
tool_knife_utility_17_mm_blade: Identify the closed tool represented by this generic record. Capture the housing outline and thickness. This holder also references the photographed closed knife as an alternative. Show alternatives in separate views of the single slot.
tool_knife_exacto_17mm_black: Reuse the photographed closed utility knife and its documented edge-on pose. Apply the companion-pocket offset for the Prit, Quikpik and bench layouts. Use utility knife in public text and retain the existing OOMP ID.
tool_knife_utility_blade_disposal_can_olfa_dc_3: Use the existing Ø67 × 24 body, the archived OLFA photo and the linked specifications. Add the rim and closed sliding door for recognition if needed. Orient the broad face outward and check the door and rim against the lip.
tool_measure_caliper_digital_150_mm_length_mitutoyo_mit500_196_30: Reuse the closed caliper model and compare the slider and jaw landmarks to the local Mitutoyo drawing. Keep the jaws closed and display visible. Check the depth of the slider separately from the beam.
tool_measure_tape_measure_5000_mm_length_stanley_1_30_696: Match article 1-30-696 before collecting case width, height, depth and clip projection. Model the retracted case, lock and hook. The five-metre value is tape capacity. Check seating with the clip in its actual orientation.
tool_screwdriver_driver_bit: Identify a representative bit for the 60 mm profile. Measure actual length, shank across flats, tip form and transition. Model a hex section and distinct tip. Check the lowest seating point and exposed pickup length in all four layouts.
quarter_inch: Use a representative long quarter-inch drive bit, recording its actual length and tip form. Model the 6.35 mm across-flats hexagon and its transitions. Check pickup height in the deepest pockets and both staggered layers. The 3/5/7-row blocks hold 23/38/53 bits.
tool_screwdriver_multi_quikpik_200_mm_knife: Identify the 200 mm multi-driver independently of the shorter Teeny Turner. Measure grip envelope, shoulders, shaft and exposed bit. Stage the compound scene with the separate closed knife in its own slot and check both insertion paths.
picquic_teeny_turner: Use the local CDR outline and existing four-section Teeny Turner. Verify the short grip and exposed bit, orient shaft down and check that the grip shoulder bears on the holder.
tool_pliers_needlenose_generic_130_mm_blue: Use the blue-pliers photo, overlay and verified single-place pose. Keep the closed nose down and check grip spread against the nearest bench tools.
tool_side_cutters_generic_110_mm_red: Use this tool as the photo-modelling example. Preserve the calibrated outline, grip thickness and single-place guide. Check cutter handle sweep against adjacent tools in the bench stand.
tool_wire_strippers_generic_120_red: Reuse the photo-calibrated stripper with its published provisional reference length. Preserve the exposed adjustment hardware and check it against the neighbouring tools in the stand.
tool_timer_80_mm_diameter_30_mm_depth_black: Use the existing Ø80 × 30 body. Verify the front face and controls from the actual timer before adding detail. Orient the visible face toward the room, and check the retaining rim.
tool_wrench_m7: The FACOM 34.7 representative has a 15 × 2.7 mm head and 80 mm length. Its simplified independent model fits the 16 × 4.5 mm single pocket. Check the four-spanner holder and bench separately, and confirm the actual workshop specimen.
tool_wrench_m8: The representative is now the Stahlwille OPEN BOX 14, article 40100808. Its 17.5 × 5 mm open head fits the 18 × 5.5 mm single pocket with the open end down in the simplified pose. The ring offset is simplified. The previous FACOM 34.8 reference has an 18.5 mm head and intersected the pocket in a centred insertion check. Measure the actual workshop spanner and check the mixed holders separately.
tool_wrench_m10: Completed single-place pilot. Use its ring-down transform as a starting point for the 2/3/4-place layouts, the four-size holder and the two M10 seats in the bench stand. Derive each station from its own holder record.
tool_wrench_m13: Completed single-place pilot. Reuse the independently dimensioned model for the four-size holder once M10, M8 and M7 are available. Check each ring against its own pocket floor.
tool_wrench_m21: Bahco 111M-21 has length 250, ring/open widths 32.9/45 and thicknesses 12.2/7.9. Its ring is thicker than the 10 mm legacy pocket and the open head is wider than the 44 mm slot. Find the actual flatter specimen or document the mismatch. Keep the sourced model at full scale.
